name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare password hash
        env:
          CALENDAR_PASSWORD: ${{ secrets.CALENDAR_PASSWORD }}
        run: echo "VITE_PASSWORD_HASH=$(printf '%s' "$CALENDAR_PASSWORD" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_MEDIA_CONFIG: ${{ secrets.CALENDAR_MEDIA }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
